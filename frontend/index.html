<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Agent</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 20px;
      }
      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 24px;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        border-radius: 12px;
        padding: 14px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04);
        color: white;
      }
      button {
        margin-top: 12px;
        background: #4f46e5;
        color: white;
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      #result {
        margin-top: 24px;
        white-space: pre-wrap;
        background: rgba(255,255,255,0.03);
        border-radius: 12px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Coding Agent</h1>
      <div class="card">
        <textarea id="prompt" placeholder="Describe the app or page you want to generate...">Create a login page with email and password fields and a sign-in button</textarea>
        <button id="send">Generate</button>
        <div id="result"></div>
      </div>
    </div>

    <script>
      const promptEl = document.getElementById('prompt');
      const sendBtn = document.getElementById('send');
      const resultEl = document.getElementById('result');

      sendBtn.addEventListener('click', async function () {
        const text = promptEl.value.trim();
        if (!text) return;

        resultEl.textContent = 'Generating...';

        try {
          const response = await fetch('http://localhost:8000/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });

          const data = await response.json();
          resultEl.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          resultEl.textContent = 'Error: ' + error.message + '\nThe backend server may not be running yet.';
        }
      });
    </script>
  </body>
</html>
