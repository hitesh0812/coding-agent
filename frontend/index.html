<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Agent Workspace</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e5e7eb; }
    .shell { max-width: 1100px; margin: auto; padding: 28px 18px; }
    .grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 18px; }
    .card { background: #111827; border: 1px solid #263244; border-radius: 14px; padding: 18px; }
    textarea { width: 100%; min-height: 120px; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: inherit; }
    button, a.button { display: inline-block; margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 8px; background: #4f46e5; color: white; text-decoration: none; cursor: pointer; }
    button.secondary { background: #334155; }
    pre { max-height: 460px; overflow: auto; white-space: pre-wrap; background: #0b1220; padding: 12px; border-radius: 8px; }
    .project { border-top: 1px solid #263244; padding: 12px 0; }
    .muted { color: #94a3b8; font-size: .9rem; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <h1>Coding Agent Workspace</h1>
    <p class="muted">Generate a project, inspect its files, and download a ZIP archive.</p>
    <div class="grid">
      <section class="card">
        <h2>New project</h2>
        <textarea id="prompt">Create a login page with email and password fields and a sign-in button</textarea>
        <br /><button id="generate">Generate project</button>
        <pre id="result">Ready.</pre>
      </section>
      <aside class="card">
        <h2>Saved projects</h2>
        <button class="secondary" id="refresh">Refresh</button>
        <div id="projects" class="muted">Loading...</div>
      </aside>
    </div>
  </main>
  <script>
    const result = document.getElementById('result');
    const projects = document.getElementById('projects');
    async function loadProjects() {
      const response = await fetch('/api/projects');
      const data = await response.json();
      projects.innerHTML = data.projects.length ? data.projects.map(project => `
        <div class="project"><strong>${project.id}</strong><br />
        <span class="muted">${project.files.length} files · ${project.created_at}</span><br />
        <a class="button" href="/api/projects/${project.id}/download">Download ZIP</a>
        <button class="secondary" onclick="inspectProject('${project.id}')">Inspect</button></div>`).join('') : 'No projects yet.';
    }
    async function inspectProject(id) {
      const response = await fetch('/api/projects/' + id);
      result.textContent = JSON.stringify(await response.json(), null, 2);
    }
    document.getElementById('refresh').onclick = loadProjects;
    document.getElementById('generate').onclick = async () => {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;
      result.textContent = 'Generating and writing project files...';
      const response = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: prompt}) });
      const data = await response.json();
      result.textContent = JSON.stringify(data, null, 2);
      await loadProjects();
    };
    loadProjects();
  </script>
</body>
</html>
